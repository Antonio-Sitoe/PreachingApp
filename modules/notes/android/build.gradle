buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.notes'
version = '0.1.0'

android {
  namespace "expo.modules.notes"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // Compose 1.11 (o que a richeditor 1.1.0 traz). A 1.2.x puxa Compose 1.12 / material3 1.5-alpha,
  // que exigem compileSdk 37 e AGP 9.1; o RN 0.86 está em compileSdk 36 / AGP 8.12.
  implementation 'androidx.compose.foundation:foundation-android:1.11.4'
  implementation 'androidx.compose.ui:ui-android:1.11.4'
  implementation 'androidx.compose.material3:material3-android:1.4.0'

  // Compose Rich Editor (MohamedRejeb, Apache-2.0). Metadata Kotlin 2.4: lida pelo compilador
  // 2.3.20 que a app usa (plugins/with-kotlin-gradle-plugin.js).
  implementation 'com.mohamedrejeb.richeditor:richeditor-compose:1.1.0'

  // Arrastar blocos dentro da LazyColumn (Calvin-LL, Apache-2.0).
  implementation 'sh.calvin.reorderable:reorderable:3.1.0'
}
