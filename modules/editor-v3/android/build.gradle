buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.editorv3'
version = '0.1.0'

android {
  namespace "expo.modules.editorv3"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // As versões que a richeditor 1.2.1 traz (Compose Multiplatform 1.12). São mais recentes que as
  // do @expo/ui (1.10.6), e o Gradle usa estas para a app toda.
  implementation 'androidx.compose.foundation:foundation-android:1.12.0'
  implementation 'androidx.compose.ui:ui-android:1.12.0'
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha22'

  // Compose Rich Editor (MohamedRejeb, Apache-2.0). Compilada com Kotlin 2.4: a app tem de usar
  // kotlinVersion 2.4.x.
  implementation 'com.mohamedrejeb.richeditor:richeditor-compose:1.2.1'

  // Arrastar blocos dentro da LazyColumn (Calvin-LL, Apache-2.0).
  implementation 'sh.calvin.reorderable:reorderable:3.1.0'
}
