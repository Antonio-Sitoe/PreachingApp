buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.editorcascade'
version = '0.1.0'

android {
  namespace "expo.modules.editorcascade"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // Mesmas versões do @expo/ui; o cascade-editor puxa o Compose 1.11 e o Gradle fica com a maior.
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'

  // Cascade Editor (linreal, MIT). Compilado com Kotlin 2.3 e pede minSdk 26 (ver app.config.js).
  implementation 'io.github.linreal:cascade-editor:1.9.3'
}
